[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodev"
version = "0.1.0"
description = "Local AI dev team — takes natural language requests, outputs tested code"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]
rag = [
    "chromadb>=0.5.0",
]
memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.0.0",
]

[project.scripts]
autodev = "autodev.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.ruff]
target-version = "py311"
line-length = 100
