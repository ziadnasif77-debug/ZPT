llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  timeout_seconds: 300
  cache_enabled: true

models:
  default: "qwen2.5-coder:7b"

agent_models:
  product_manager: "default"
  architect: "default"
  developer: "default"
  tester: "default"
  debugger: "default"
  reviewer: "default"
  judge: "default"

context:
  max_tokens_per_model:
    "qwen3-coder:latest": 32000
    "qwen2.5-coder:7b": 32000
  relevant_files_only: true
  summarize_when_over_budget: true

sandbox:
  backend: "docker"
  image: "autodev-sandbox:latest"
  cpu_limit: "1.0"
  memory_limit: "512m"
  timeout_seconds: 30
  network: false
  workspace_mount_readonly: false

loop:
  max_iterations: 15
  stop_if_no_progress: true
  pass_full_attempt_history: true

git:
  auto_commit: true
  rollback_on_repeated_error: true

error_graph:
  enabled: true
  path: "./logs/error_graph.json"
  escalate_after: 5

memory:
  enabled: true
  db_path: "./memory_db"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 3
  min_similarity: 0.7
  save_lessons: true

packages:
  auto_install: true
  auto_update: false
  rebuild_on_install: true
  audit_before_run: true

human_in_the_loop:
  approve_plan: true

observability:
  log_dir: "./logs"
  log_every_call: true

workspace_dir: "./workspace"
